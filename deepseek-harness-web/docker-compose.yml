services:
  dsh-web:
    image: registry.cn-hangzhou.aliyuncs.com/bohai_repo/deepseek-harness-web:1.0.0
    build: .
    container_name: dsh-web
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3080"
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      # 未设置 BASE_URL 时走官方 DeepSeek（API_KEY 即 DeepSeek 密钥）
      DEEPSEEK_API_KEY: ${API_KEY}
      # 可选：自定义 OpenAI 兼容网关
      BASE_URL: ${BASE_URL:-}
      MODEL: ${MODEL:-}
      TRUSTED_HOST: ${TRUSTED_HOST:-}
      WORKSPACE_DIR: ${WORKSPACE_DIR:-default}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DSH_WEB_HOST: ${DSH_WEB_HOST:-}
      DSH_TELEMETRY_DISABLED: "1"
    volumes:
      # 工作区与 dsh 配置（.dsh）都在 /root，通过 ./home 持久化
      - ./home:/root
